<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dock-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="50%" stop-color="#1c1f2b" />
      <stop offset="100%" stop-color="#161822" />
    </linearGradient>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f3f4f6; }
    .handle { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #9ca3af; }
    
    .card { transition: all 0.25s ease; cursor: pointer; }
    .card:hover rect.card-bg { fill: #212430; stroke: #4b5563; }
    .card:hover text.handle { fill: #ffffff; }
  </style>

  <!-- Background Dock (Studio Gray) -->
  <rect width="920" height="120" fill="url(#dock-grad)" stroke="#262a38" stroke-width="1" rx="8" />

  <!-- Top Metadata -->
  <text x="32" y="28" fill="#f3f4f6" font-size="10" class="mono" font-weight="700">SECURE CHANNELS &amp; COORDINATES</text>
  <text x="888" y="28" fill="#22c55e" font-size="9" text-anchor="end" class="mono" font-weight="600">● AVAILABLE FOR ARCHITECTURAL INITIATIVES</text>

  <!-- 4 Clickable Channel Cards -->
  <g transform="translate(24, 42)">
    <!-- 01: Email (Brand Coral / Amber) -->
    <a href="mailto:thepalearchitect@gmail.com" target="_blank" class="card">
      <rect width="206" height="58" fill="#181a23" stroke="#2b2e3e" stroke-width="1" rx="5" class="card-bg" />
      <!-- Mail Icon -->
      <g transform="translate(16, 17)">
        <rect width="22" height="16" fill="none" stroke="#f97316" stroke-width="1.5" rx="2" />
        <path d="M 1 2 L 11 10 L 21 2" fill="none" stroke="#f97316" stroke-width="1.5" />
      </g>
      <text x="48" y="28" class="label">EMAIL</text>
      <text x="48" y="44" class="handle">thepalearchitect</text>
    </a>

    <!-- 02: GitHub (Brand White) -->
    <a href="https://github.com/palearchitect" target="_blank" class="card" transform="translate(222, 0)">
      <rect width="206" height="58" fill="#181a23" stroke="#2b2e3e" stroke-width="1" rx="5" class="card-bg" />
      <!-- GitHub Icon -->
      <g transform="translate(16, 17)">
        <path d="M11 0C4.9 0 0 4.9 0 11c0 4.8 3.1 9 7.5 10.5.5.1.8-.2.8-.5v-1.8c-3.1.7-3.7-1.5-3.7-1.5-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.4-.3-5-1.2-5-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-3 0 0 .9-.3 3.1 1.2.9-.2 1.8-.4 2.8-.4s1.9.2 2.8.4c2.1-1.5 3.1-1.2 3.1-1.2.6 1.6.2 2.7.1 3 .7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5 5.5.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.3-1.5 7.5-5.6 7.5-10.5 0-6.1-4.9-11-11-11z" fill="#ffffff"/>
      </g>
      <text x="48" y="28" class="label">GITHUB</text>
      <text x="48" y="44" class="handle">@palearchitect</text>
    </a>

    <!-- 03: X / Twitter (Brand White) -->
    <a href="https://x.com/palearchitect" target="_blank" class="card" transform="translate(444, 0)">
      <rect width="206" height="58" fill="#181a23" stroke="#2b2e3e" stroke-width="1" rx="5" class="card-bg" />
      <!-- X Icon -->
      <g transform="translate(18, 19)">
        <path d="M14.2 0h2.8l-6.1 7 7.2 9.5h-5.6l-4.4-5.8-5 5.8H0.3l6.5-7.5L0 0h5.7l4 5.3L14.2 0zm-1 14.8h1.5L4.9 1.5H3.3l9.9 13.3z" fill="#ffffff" />
      </g>
      <text x="48" y="28" class="label">X / TWITTER</text>
      <text x="48" y="44" class="handle">@palearchitect</text>
    </a>

    <!-- 04: Instagram (Brand Gradient) -->
    <a href="https://instagram.com/palearchitect" target="_blank" class="card" transform="translate(666, 0)">
      <rect width="206" height="58" fill="#181a23" stroke="#2b2e3e" stroke-width="1" rx="5" class="card-bg" />
      <!-- Instagram Icon -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="none" stroke="url(#ig-grad)" stroke-width="1.8" />
        <circle cx="11" cy="11" r="5" fill="none" stroke="url(#ig-grad)" stroke-width="1.8" />
        <circle cx="16.5" cy="5.5" r="1.2" fill="#ec4899" />
      </g>
      <text x="48" y="28" class="label">INSTAGRAM</text>
      <text x="48" y="44" class="handle">@palearchitect</text>
    </a>
  </g>
</svg>
