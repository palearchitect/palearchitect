<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 60" width="100%" height="100%">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f3f4f6; }
    .handle { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #9ca3af; }
    rect { transition: all 0.2s ease; }
    rect:hover { fill: #212430; stroke: #ec4899; }
  </style>
  <rect width="216" height="60" fill="#181a23" stroke="#2b2e3e" stroke-width="1.2" rx="6" />
  <!-- Authentic Instagram Logo -->
  <g transform="translate(18, 19)">
    <rect x="0" y="0" width="22" height="22" rx="6" fill="none" stroke="url(#ig-grad)" stroke-width="1.8" />
    <circle cx="11" cy="11" r="5" fill="none" stroke="url(#ig-grad)" stroke-width="1.8" />
    <circle cx="16.5" cy="5.5" r="1.2" fill="#ec4899" />
  </g>
  <text x="50" y="28" class="label">INSTAGRAM</text>
  <text x="50" y="44" class="handle">@palearchitect</text>
</svg>
