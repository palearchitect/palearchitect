<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <pattern id="fine-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#171717" stroke-width="0.75" />
    </pattern>
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#b8b8b8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .editorial-serif {
      font-family: 'Cinzel', 'Didot', 'Playfair Display', 'Bodoni MT', Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.22em;
    }
    .editorial-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 500;
      letter-spacing: 0.16em;
    }
    .mono {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      letter-spacing: 0.08em;
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    .beacon { animation: subtlePulse 2.8s ease-in-out infinite; }
  </style>

  <!-- Solid Deep Onyx Ground -->
  <rect width="920" height="220" fill="#030303" rx="4" />
  <rect width="920" height="220" fill="url(#fine-grid)" rx="4" />

  <!-- Perimeter Inset Guide (Editorial Drafting Line) -->
  <rect x="14" y="14" width="892" height="192" fill="none" stroke="#1c1c1c" stroke-width="1" />

  <!-- Corner Drafting Marks -->
  <path d="M 10 24 L 24 24 M 24 10 L 24 24" stroke="#ffffff" stroke-width="1" />
  <path d="M 910 24 L 896 24 M 896 10 L 896 24" stroke="#ffffff" stroke-width="1" />
  <path d="M 10 196 L 24 196 M 24 210 L 24 196" stroke="#ffffff" stroke-width="1" />
  <path d="M 910 196 L 896 196 M 896 210 L 896 196" stroke="#ffffff" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <text x="36" y="38" fill="#888888" font-size="9.5" class="mono">SYSTEMS SPECIFICATION • VOL. 01</text>
  <circle cx="872" cy="34" r="3" fill="#ffffff" class="beacon" />
  <text x="860" y="38" fill="#e5e5e5" font-size="9" text-anchor="end" class="mono">STATUS: OPERATIONAL</text>

  <!-- Large Editorial Japanese Kanji Watermark -->
  <text x="460" y="142" fill="#0d0d0d" font-size="120" font-family="'Noto Serif JP', 'Yu Mincho', serif" text-anchor="middle" font-weight="900">建築</text>

  <!-- Primary Headline Typography -->
  <text x="460" y="108" fill="url(#ink-grad)" font-size="34" text-anchor="middle" class="editorial-serif">THE PALE ARCHITECT</text>
  <text x="460" y="136" fill="#8e8e8e" font-size="10.5" text-anchor="middle" class="editorial-sans">FULL-STACK SYSTEMS • AUTONOMOUS AGENTS • DISTRIBUTED RUNTIMES</text>

  <!-- Bottom Coordinates Matrix (Editorial Spacing) -->
  <g transform="translate(0, 184)">
    <text x="36" y="0" fill="#525252" font-size="9" class="mono">DISCIPLINE: RUST • GO • PYTORCH • NEXT.JS</text>
    <text x="460" y="0" fill="#3a3a3a" font-size="9" text-anchor="middle" class="mono">40.7128° N, 74.0060° W</text>
    <text x="884" y="0" fill="#525252" font-size="9" text-anchor="end" class="mono">LATENCY: 0.38ms</text>
  </g>
</svg>
