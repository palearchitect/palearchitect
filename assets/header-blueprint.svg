<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#262626" stroke-width="0.75" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="fade-overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#050505" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="chrome-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#e5e5e5" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#737373" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .serif-title { font-family: 'Cinzel', 'Playfair Display', Georgia, serif; font-weight: 700; letter-spacing: 0.28em; }
    .ink-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: 0.18em; }
    .glow-dim { text-shadow: 0 0 12px rgba(255,255,255,0.25); }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.35; } }
    .blink { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="280" fill="#000000" rx="10" />
  <rect width="920" height="280" fill="url(#arch-grid)" rx="10" />
  <rect width="920" height="280" fill="url(#fade-overlay)" rx="10" />

  <!-- Architectural Outer Framing -->
  <rect x="12" y="12" width="896" height="256" fill="none" stroke="#2a2a2a" stroke-width="1" rx="6" />
  <rect x="16" y="16" width="888" height="248" fill="none" stroke="#171717" stroke-width="0.75" rx="4" />

  <!-- Corner Coordinates & Crosshairs -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 896 36 L 896 24 L 884 24" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 24 244 L 24 256 L 36 256" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 896 244 L 896 256 L 884 256" fill="none" stroke="#ffffff" stroke-width="1.5" />

  <!-- Top Metadata Header -->
  <text x="44" y="42" fill="#737373" font-size="10" class="mono" font-weight="600">SYS.ID: THE-PALE-ARCHITECT</text>
  <text x="460" y="42" fill="#525252" font-size="9" text-anchor="middle" class="mono">DISCIPLINE // HIGH-CONCURRENCY DISTRIBUTED SYSTEMS &amp; AUTONOMOUS AGENTS</text>
  <circle cx="866" cy="39" r="3.5" fill="#ffffff" class="blink" />
  <text x="854" y="42" fill="#a3a3a3" font-size="9" text-anchor="end" class="mono">STATUS: ACTIVE</text>

  <!-- Divider Rule -->
  <path d="M 40 54 L 880 54" stroke="url(#chrome-rule)" stroke-width="1" />

  <!-- Central Kanji / Monogram Watermark -->
  <text x="460" y="165" fill="#141414" font-size="110" font-family="'Noto Serif JP', serif" text-anchor="middle" font-weight="900">構 造</text>

  <!-- Main Persona Display -->
  <text x="460" y="118" fill="#f5f5f5" font-size="32" text-anchor="middle" class="serif-title glow-dim">THE PALE ARCHITECT</text>
  <text x="460" y="146" fill="#a3a3a3" font-size="11" text-anchor="middle" class="ink-sub" font-weight="500">FULL-STACK SYSTEMS &amp; AUTONOMOUS AGENTIC ARCHITECTURES</text>

  <!-- Telemetry Row / Specs -->
  <g transform="translate(110, 172)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="160" height="42" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="3" />
    <text x="12" y="18" fill="#737373" font-size="8.5" class="mono">01 / RUNTIME</text>
    <text x="12" y="32" fill="#e5e5e5" font-size="11" font-weight="700" class="mono">GO • RUST • C++</text>

    <!-- Node 2 -->
    <rect x="180" y="0" width="160" height="42" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="3" />
    <text x="192" y="18" fill="#737373" font-size="8.5" class="mono">02 / AGENTIC AI</text>
    <text x="192" y="32" fill="#e5e5e5" font-size="11" font-weight="700" class="mono">PYTORCH • LLMS</text>

    <!-- Node 3 -->
    <rect x="360" y="0" width="160" height="42" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="3" />
    <text x="372" y="18" fill="#737373" font-size="8.5" class="mono">03 / WEB &amp; CLOUD</text>
    <text x="372" y="32" fill="#e5e5e5" font-size="11" font-weight="700" class="mono">NEXT.JS • K8S • TS</text>

    <!-- Node 4 -->
    <rect x="540" y="0" width="160" height="42" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="3" />
    <text x="552" y="18" fill="#737373" font-size="8.5" class="mono">04 / DATA MESH</text>
    <text x="552" y="32" fill="#e5e5e5" font-size="11" font-weight="700" class="mono">PGSQL • VECTOR</text>
  </g>

  <!-- Bottom Technical Legend -->
  <path d="M 40 232 L 880 232" stroke="#262626" stroke-width="0.75" />
  <text x="44" y="247" fill="#525252" font-size="8.5" class="mono">PROTOCOL: DETERMINISTIC // ZERO CYBERPUNK CLICHÉS // MONOCHROME PRECISION</text>
  <text x="876" y="247" fill="#737373" font-size="8.5" text-anchor="end" class="mono">LATENCY: 0.42ms // EPOCH 2026.09</text>
</svg>
