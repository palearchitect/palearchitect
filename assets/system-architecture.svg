<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <pattern id="matrix-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#262626" />
    </pattern>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; letter-spacing: 0.1em; }
    .sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; }
  </style>

  <!-- Background -->
  <rect width="920" height="340" fill="#050505" rx="10" />
  <rect width="920" height="340" fill="url(#matrix-grid)" rx="10" />
  <rect x="12" y="12" width="896" height="316" fill="none" stroke="#262626" stroke-width="1" rx="8" />

  <!-- Section Header -->
  <text x="36" y="42" fill="#737373" font-size="10" class="mono" font-weight="700">LAYER 00 // ARCHITECTURAL PILLARS &amp; EXECUTION ENGINE</text>
  <line x1="36" y1="52" x2="884" y2="52" stroke="#262626" stroke-width="1" />

  <!-- Layer 1: Autonomous Agent & Intelligence Core -->
  <g transform="translate(36, 70)">
    <rect width="196" height="220" fill="url(#box-grad)" stroke="#333333" stroke-width="1" rx="4" />
    <rect x="0" y="0" width="196" height="28" fill="#171717" rx="4" />
    <text x="14" y="18" fill="#ffffff" font-size="11" class="mono" font-weight="700">01 // AGENTIC CORE</text>
    <circle cx="180" cy="14" r="3" fill="#ffffff" />
    
    <text x="14" y="52" fill="#a3a3a3" font-size="10" class="mono">ORCHESTRATION</text>
    <text x="14" y="68" fill="#e5e5e5" font-size="12" class="title">Autonomous Loops</text>
    <text x="14" y="84" fill="#737373" class="sub">LangChain • LlamaIndex</text>

    <line x1="14" y1="102" x2="182" y2="102" stroke="#262626" stroke-width="0.75" />

    <text x="14" y="122" fill="#a3a3a3" font-size="10" class="mono">MODEL PIPELINES</text>
    <text x="14" y="138" fill="#e5e5e5" font-size="12" class="title">PyTorch &amp; GenAI</text>
    <text x="14" y="154" fill="#737373" class="sub">Fine-tuning • Evaluators</text>

    <line x1="14" y1="172" x2="182" y2="172" stroke="#262626" stroke-width="0.75" />
    
    <text x="14" y="192" fill="#737373" font-size="9" class="mono">TOOL CALLING &amp; MCP</text>
    <text x="14" y="206" fill="#525252" font-size="9" class="mono">Deterministic Actions</text>
  </g>

  <!-- Connectors -->
  <path d="M 232 180 L 256 180" stroke="#525252" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Layer 2: High-Concurrency Distributed Engine -->
  <g transform="translate(256, 70)">
    <rect width="196" height="220" fill="url(#box-grad)" stroke="#333333" stroke-width="1" rx="4" />
    <rect x="0" y="0" width="196" height="28" fill="#171717" rx="4" />
    <text x="14" y="18" fill="#ffffff" font-size="11" class="mono" font-weight="700">02 // SYSTEMS ENGINE</text>
    <circle cx="180" cy="14" r="3" fill="#ffffff" />
    
    <text x="14" y="52" fill="#a3a3a3" font-size="10" class="mono">LOW-LATENCY RUNTIME</text>
    <text x="14" y="68" fill="#e5e5e5" font-size="12" class="title">Rust • Go • C++</text>
    <text x="14" y="84" fill="#737373" class="sub">Microservices • gRPC • IO</text>

    <line x1="14" y1="102" x2="182" y2="102" stroke="#262626" stroke-width="0.75" />

    <text x="14" y="122" fill="#a3a3a3" font-size="10" class="mono">API ARCHITECTURE</text>
    <text x="14" y="138" fill="#e5e5e5" font-size="12" class="title">FastAPI • Node.js</text>
    <text x="14" y="154" fill="#737373" class="sub">Event-Driven Streams</text>

    <line x1="14" y1="172" x2="182" y2="172" stroke="#262626" stroke-width="0.75" />
    
    <text x="14" y="192" fill="#737373" font-size="9" class="mono">CONCURRENCY SPECS</text>
    <text x="14" y="206" fill="#525252" font-size="9" class="mono">Async IO • SIMD • Memory</text>
  </g>

  <!-- Connectors -->
  <path d="M 452 180 L 476 180" stroke="#525252" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Layer 3: Persistence & Vector Search Mesh -->
  <g transform="translate(476, 70)">
    <rect width="196" height="220" fill="url(#box-grad)" stroke="#333333" stroke-width="1" rx="4" />
    <rect x="0" y="0" width="196" height="28" fill="#171717" rx="4" />
    <text x="14" y="18" fill="#ffffff" font-size="11" class="mono" font-weight="700">03 // PERSISTENCE</text>
    <circle cx="180" cy="14" r="3" fill="#ffffff" />
    
    <text x="14" y="52" fill="#a3a3a3" font-size="10" class="mono">RELATIONAL &amp; CACHE</text>
    <text x="14" y="68" fill="#e5e5e5" font-size="12" class="title">PostgreSQL • Redis</text>
    <text x="14" y="84" fill="#737373" class="sub">ACID • PubSub • Distributed</text>

    <line x1="14" y1="102" x2="182" y2="102" stroke="#262626" stroke-width="0.75" />

    <text x="14" y="122" fill="#a3a3a3" font-size="10" class="mono">VECTOR EMBEDDINGS</text>
    <text x="14" y="138" fill="#e5e5e5" font-size="12" class="title">Vector Databases</text>
    <text x="14" y="154" fill="#737373" class="sub">Qdrant • Pinecone • Chroma</text>

    <line x1="14" y1="172" x2="182" y2="172" stroke="#262626" stroke-width="0.75" />
    
    <text x="14" y="192" fill="#737373" font-size="9" class="mono">STATE RECOVERY</text>
    <text x="14" y="206" fill="#525252" font-size="9" class="mono">Write-Ahead Logs • Snaps</text>
  </g>

  <!-- Connectors -->
  <path d="M 672 180 L 696 180" stroke="#525252" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Layer 4: Platform, DevSecOps & Modern UI -->
  <g transform="translate(696, 70)">
    <rect width="188" height="220" fill="url(#box-grad)" stroke="#333333" stroke-width="1" rx="4" />
    <rect x="0" y="0" width="188" height="28" fill="#171717" rx="4" />
    <text x="14" y="18" fill="#ffffff" font-size="11" class="mono" font-weight="700">04 // CLOUD &amp; UI</text>
    <circle cx="172" cy="14" r="3" fill="#ffffff" />
    
    <text x="14" y="52" fill="#a3a3a3" font-size="10" class="mono">INFRASTRUCTURE</text>
    <text x="14" y="68" fill="#e5e5e5" font-size="12" class="title">K8s • Docker • TF</text>
    <text x="14" y="84" fill="#737373" class="sub">GCP • AWS • CI/CD Actions</text>

    <line x1="14" y1="102" x2="174" y2="102" stroke="#262626" stroke-width="0.75" />

    <text x="14" y="122" fill="#a3a3a3" font-size="10" class="mono">FRONTEND SURFACES</text>
    <text x="14" y="138" fill="#e5e5e5" font-size="12" class="title">Next.js • React • TS</text>
    <text x="14" y="154" fill="#737373" class="sub">High-Performance Interfaces</text>

    <line x1="14" y1="172" x2="174" y2="172" stroke="#262626" stroke-width="0.75" />
    
    <text x="14" y="192" fill="#737373" font-size="9" class="mono">DEVSECOPS PIPELINE</text>
    <text x="14" y="206" fill="#525252" font-size="9" class="mono">Audits • SAST • Zero-Trust</text>
  </g>

  <!-- Bottom Coordinates -->
  <text x="36" y="312" fill="#525252" font-size="8.5" class="mono">TOPOLOGY: COMPONENT MESH // 4 DECOUPLED TIERS // STRICT TYPING &amp; ASYNC IO</text>
  <text x="884" y="312" fill="#525252" font-size="8.5" text-anchor="end" class="mono">INTEGRITY: VERIFIED</text>
</svg>
