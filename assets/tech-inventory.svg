<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%">
  <defs>
    <pattern id="inv-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#141414" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .tier-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="920" height="330" fill="#070707" rx="6" />
  <rect width="920" height="330" fill="url(#inv-grid)" rx="6" />
  <rect x="8" y="8" width="904" height="314" fill="none" stroke="#1c1c1c" stroke-width="1" rx="5" />

  <!-- Tier 1: Systems (Amber / Orange & Systems Blue Accent) -->
  <g transform="translate(24, 20)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#2d170b" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title" fill="#ffedd5">CORE SYSTEMS</text>
    <text x="18" y="42" fill="#ea580c" font-size="8.5" class="mono" font-weight="600">TIER 01</text>

    <!-- Badges Row (x=160) -->
    <g transform="translate(160, 13)">
      <!-- Rust -->
      <g transform="translate(0, 0)">
        <rect width="84" height="26" fill="#241006" stroke="#ea580c" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#f97316" />
        <text x="48" y="17" text-anchor="middle" class="badge-text" fill="#ffedd5">RUST</text>
      </g>
      <!-- Go -->
      <g transform="translate(92, 0)">
        <rect width="72" height="26" fill="#061e2e" stroke="#0284c7" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#38bdf8" />
        <text x="42" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">GO</text>
      </g>
      <!-- C++ -->
      <g transform="translate(172, 0)">
        <rect width="74" height="26" fill="#0c1836" stroke="#2563eb" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#60a5fa" />
        <text x="43" y="17" text-anchor="middle" class="badge-text" fill="#dbeafe">C++</text>
      </g>
      <!-- Python -->
      <g transform="translate(254, 0)">
        <rect width="96" height="26" fill="#261e05" stroke="#d97706" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#facc15" />
        <text x="54" y="17" text-anchor="middle" class="badge-text" fill="#fef08a">PYTHON</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(358, 0)">
        <rect width="118" height="26" fill="#0c1d38" stroke="#3b82f6" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#60a5fa" />
        <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#eff6ff">TYPESCRIPT</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(484, 0)">
        <rect width="118" height="26" fill="#241e05" stroke="#ca8a04" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#fde047" />
        <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#fef9c3">JAVASCRIPT</text>
      </g>
    </g>
  </g>

  <!-- Tier 2: Agentic AI (Violet / Magenta Accent) -->
  <g transform="translate(24, 80)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#2a103d" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title" fill="#f3e8ff">AGENTIC AI</text>
    <text x="18" y="42" fill="#c084fc" font-size="8.5" class="mono" font-weight="600">TIER 02</text>

    <!-- Badges Row -->
    <g transform="translate(160, 13)">
      <!-- PyTorch -->
      <g transform="translate(0, 0)">
        <rect width="96" height="26" fill="#260b0b" stroke="#dc2626" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#f87171" />
        <text x="54" y="17" text-anchor="middle" class="badge-text" fill="#fee2e2">PYTORCH</text>
      </g>
      <!-- LangChain -->
      <g transform="translate(104, 0)">
        <rect width="108" height="26" fill="#052418" stroke="#059669" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#34d399" />
        <text x="60" y="17" text-anchor="middle" class="badge-text" fill="#d1fae5">LANGCHAIN</text>
      </g>
      <!-- LlamaIndex -->
      <g transform="translate(220, 0)">
        <rect width="114" height="26" fill="#1b0c36" stroke="#7c3aed" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#a78bfa" />
        <text x="63" y="17" text-anchor="middle" class="badge-text" fill="#ede9fe">LLAMAINDEX</text>
      </g>
      <!-- OpenAI API -->
      <g transform="translate(342, 0)">
        <rect width="104" height="26" fill="#062228" stroke="#0891b2" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#22d3ee" />
        <text x="58" y="17" text-anchor="middle" class="badge-text" fill="#cffafe">OPENAI API</text>
      </g>
      <!-- HuggingFace -->
      <g transform="translate(454, 0)">
        <rect width="122" height="26" fill="#281702" stroke="#d97706" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#fbbf24" />
        <text x="67" y="17" text-anchor="middle" class="badge-text" fill="#fef3c7">HUGGINGFACE</text>
      </g>
      <!-- MCP Protocol -->
      <g transform="translate(584, 0)">
        <rect width="116" height="26" fill="#280a1c" stroke="#db2777" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#f472b6" />
        <text x="64" y="17" text-anchor="middle" class="badge-text" fill="#fce7f3">MCP PROTOCOL</text>
      </g>
    </g>
  </g>

  <!-- Tier 3: Web & APIs (Cyan / Sky Accent) -->
  <g transform="translate(24, 140)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#0c2538" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title" fill="#e0f2fe">WEB &amp; APIS</text>
    <text x="18" y="42" fill="#38bdf8" font-size="8.5" class="mono" font-weight="600">TIER 03</text>

    <!-- Badges Row -->
    <g transform="translate(160, 13)">
      <!-- Next.js 15 -->
      <g transform="translate(0, 0)">
        <rect width="96" height="26" fill="#171717" stroke="#525252" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#ffffff" />
        <text x="54" y="17" text-anchor="middle" class="badge-text" fill="#ffffff">NEXT.JS 15</text>
      </g>
      <!-- React -->
      <g transform="translate(104, 0)">
        <rect width="86" height="26" fill="#06222b" stroke="#0891b2" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#22d3ee" />
        <text x="49" y="17" text-anchor="middle" class="badge-text" fill="#cffafe">REACT</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(198, 0)">
        <rect width="96" height="26" fill="#082412" stroke="#16a34a" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#4ade80" />
        <text x="54" y="17" text-anchor="middle" class="badge-text" fill="#dcfce7">NODE.JS</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(302, 0)">
        <rect width="94" height="26" fill="#042421" stroke="#0d9488" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#2dd4bf" />
        <text x="53" y="17" text-anchor="middle" class="badge-text" fill="#ccfbf1">FASTAPI</text>
      </g>
      <!-- gRPC -->
      <g transform="translate(404, 0)">
        <rect width="84" height="26" fill="#0c1836" stroke="#2563eb" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#60a5fa" />
        <text x="48" y="17" text-anchor="middle" class="badge-text" fill="#dbeafe">GRPC</text>
      </g>
      <!-- TailwindCSS -->
      <g transform="translate(496, 0)">
        <rect width="118" height="26" fill="#072233" stroke="#0284c7" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#38bdf8" />
        <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">TAILWINDCSS</text>
      </g>
    </g>
  </g>

  <!-- Tier 4: Data & Vectors (Emerald / Green Accent) -->
  <g transform="translate(24, 200)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#0a2a1a" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title" fill="#ecfdf5">DATA &amp; VECTORS</text>
    <text x="18" y="42" fill="#34d399" font-size="8.5" class="mono" font-weight="600">TIER 04</text>

    <!-- Badges Row -->
    <g transform="translate(160, 13)">
      <!-- PostgreSQL -->
      <g transform="translate(0, 0)">
        <rect width="118" height="26" fill="#0c1836" stroke="#2563eb" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#60a5fa" />
        <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#dbeafe">POSTGRESQL</text>
      </g>
      <!-- Redis -->
      <g transform="translate(126, 0)">
        <rect width="84" height="26" fill="#280c0c" stroke="#dc2626" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#f87171" />
        <text x="48" y="17" text-anchor="middle" class="badge-text" fill="#fee2e2">REDIS</text>
      </g>
      <!-- Qdrant -->
      <g transform="translate(218, 0)">
        <rect width="94" height="26" fill="#260a1a" stroke="#db2777" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#f472b6" />
        <text x="53" y="17" text-anchor="middle" class="badge-text" fill="#fce7f3">QDRANT</text>
      </g>
      <!-- Pinecone -->
      <g transform="translate(320, 0)">
        <rect width="104" height="26" fill="#052418" stroke="#059669" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#34d399" />
        <text x="58" y="17" text-anchor="middle" class="badge-text" fill="#d1fae5">PINECONE</text>
      </g>
      <!-- ChromaDB -->
      <g transform="translate(432, 0)">
        <rect width="108" height="26" fill="#281702" stroke="#d97706" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#fbbf24" />
        <text x="60" y="17" text-anchor="middle" class="badge-text" fill="#fef3c7">CHROMADB</text>
      </g>
    </g>
  </g>

  <!-- Tier 5: Cloud & Platform (Cobalt & Cloud Amber Accent) -->
  <g transform="translate(24, 260)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#12203d" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title" fill="#eff6ff">CLOUD &amp; DEVOPS</text>
    <text x="18" y="42" fill="#60a5fa" font-size="8.5" class="mono" font-weight="600">TIER 05</text>

    <!-- Badges Row -->
    <g transform="translate(160, 13)">
      <!-- Kubernetes -->
      <g transform="translate(0, 0)">
        <rect width="118" height="26" fill="#0c1836" stroke="#2563eb" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#60a5fa" />
        <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#dbeafe">KUBERNETES</text>
      </g>
      <!-- Docker -->
      <g transform="translate(126, 0)">
        <rect width="90" height="26" fill="#061e2e" stroke="#0284c7" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#38bdf8" />
        <text x="51" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">DOCKER</text>
      </g>
      <!-- Terraform -->
      <g transform="translate(224, 0)">
        <rect width="114" height="26" fill="#1b0c36" stroke="#7c3aed" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#a78bfa" />
        <text x="63" y="17" text-anchor="middle" class="badge-text" fill="#ede9fe">TERRAFORM</text>
      </g>
      <!-- GitHub Actions -->
      <g transform="translate(346, 0)">
        <rect width="140" height="26" fill="#141438" stroke="#4f46e5" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#818cf8" />
        <text x="76" y="17" text-anchor="middle" class="badge-text" fill="#e0e7ff">GITHUB ACTIONS</text>
      </g>
      <!-- GCP -->
      <g transform="translate(494, 0)">
        <rect width="72" height="26" fill="#281702" stroke="#d97706" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#fbbf24" />
        <text x="42" y="17" text-anchor="middle" class="badge-text" fill="#fef3c7">GCP</text>
      </g>
      <!-- AWS -->
      <g transform="translate(574, 0)">
        <rect width="72" height="26" fill="#261005" stroke="#ea580c" stroke-width="0.8" rx="3" />
        <circle cx="12" cy="13" r="2.5" fill="#fb923c" />
        <text x="42" y="17" text-anchor="middle" class="badge-text" fill="#ffedd5">AWS</text>
      </g>
    </g>
  </g>
</svg>
