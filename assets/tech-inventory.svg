<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%">
  <defs>
    <pattern id="inv-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#141414" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .tier-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; fill: #e5e5e5; }
  </style>

  <!-- Background -->
  <rect width="920" height="330" fill="#070707" rx="6" />
  <rect width="920" height="330" fill="url(#inv-grid)" rx="6" />
  <rect x="8" y="8" width="904" height="314" fill="none" stroke="#1c1c1c" stroke-width="1" rx="5" />

  <!-- Tier 1: Systems -->
  <g transform="translate(24, 20)">
    <rect width="872" height="52" fill="#0d0d0d" stroke="#1c1c1c" stroke-width="1" rx="4" />
    <text x="18" y="31" class="tier-title">CORE SYSTEMS</text>
    <text x="18" y="42" fill="#666666" font-size="8.5" class="mono">TIER 01</text>

    <!-- Badges Row (x=160) -->
    <g transform="translate(160, 13)">
      <g transform="translate(0, 0)">
        <rect width="78" height="26" fill="#141414" stroke="#262626" stroke-width="0.75" rx="3" />
        <text x="39" y="17" text-anchor="middle" class="badge-text">RUST</text>
      </g>
      <g transform="translate(86, 0)">
        <rect width="66" height="26" fill="#141414" stroke="#262626" stroke-width="0.75" rx="3" />
