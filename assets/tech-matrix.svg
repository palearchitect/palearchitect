<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="matrix-pat" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#171717" />
    </pattern>

    <!-- Clip Path for Row 4 Marquee -->
    <clipPath id="marquee-row-clip">
      <rect x="24" y="280" width="872" height="74" rx="4" />
    </clipPath>

    <clipPath id="marquee-track-clip">
      <rect x="36" y="312" width="848" height="34" />
    </clipPath>

    <!-- Edge Soft Fade Masks -->
    <linearGradient id="fade-left-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-right-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>

    <!-- Progress Meter Gradient -->
    <linearGradient id="meter-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #f5f5f5; }

    @keyframes marqueeScrollInfinite {
      0% { transform: translateX(0); }
      100% { transform: translateX(-990px); }
    }
    @keyframes loadBar1 { 0%, 100% { width: 170px; } 50% { width: 158px; } }
    @keyframes loadBar2 { 0%, 100% { width: 165px; } 50% { width: 152px; } }
    @keyframes loadBar3 { 0%, 100% { width: 160px; } 50% { width: 168px; } }

    .marquee-track { animation: marqueeScrollInfinite 20s linear infinite; }
    .meter-1 { animation: loadBar1 4s ease-in-out infinite; }
    .meter-2 { animation: loadBar2 4.5s ease-in-out infinite; }
    .meter-3 { animation: loadBar3 3.8s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect width="920" height="370" fill="#080808" rx="6" />
  <rect width="920" height="370" fill="url(#matrix-pat)" rx="6" />
  <rect x="8" y="8" width="904" height="354" fill="none" stroke="#1f1f1f" stroke-width="1" rx="5" />

  <!-- Section Header -->
  <text x="32" y="34" fill="#a3a3a3" font-size="10.5" class="mono" font-weight="700">TECHNICAL SPECIFICATION MATRIX</text>
  <text x="888" y="34" fill="#525252" font-size="9" text-anchor="end" class="mono">LIVE TELEMETRY • v4.2</text>

  <!-- Row 1: Systems & Concurrency -->
  <g transform="translate(24, 52)">
    <rect width="872" height="68" fill="#0d0d0d" stroke="#1c1c1c" stroke-width="1" rx="4" />
    <text x="20" y="28" fill="#ffffff" font-size="12" class="title">01 ▪ SYSTEMS &amp; CONCURRENCY</text>
    <text x="20" y="48" fill="#737373" font-size="9.5" class="mono">Rust • Go • C++ • Low-Latency Async IO • SIMD • Memory Safety</text>
    
    <!-- Telemetry Meter (Positioned with 40px safe margin before status badge) -->
    <g transform="translate(530, 20)">
      <text x="0" y="10" fill="#888888" font-size="8.5" class="mono">THROUGHPUT: 95%</text>
      <rect x="0" y="16" width="180" height="5" fill="#1a1a1a" rx="2.5" />
      <rect x="0" y="16" width="170" height="5" fill="url(#meter-glow)" rx="2.5" class="meter-1" />
    </g>

    <!-- Status Badge (Cleanly anchored at x=750 with 102px width) -->
    <rect x="750" y="20" width="102" height="28" fill="#141414" stroke="#2b2b2b" stroke-width="1" rx="4" />
    <circle cx="765" cy="34" r="3" fill="#ffffff" />
    <text x="778" y="38" fill="#f5f5f5" font-size="9.5" class="mono" font-weight="700">OPTIMAL</text>
  </g>

  <!-- Row 2: Agentic AI -->
  <g transform="translate(24, 128)">
    <rect width="872" height="68" fill="#0d0d0d" stroke="#1c1c1c" stroke-width="1" rx="4" />
    <text x="20" y="28" fill="#ffffff" font-size="12" class="title">02 ▪ AGENTIC AI &amp; MODEL PIPELINES</text>
    <text x="20" y="48" fill="#737373" font-size="9.5" class="mono">PyTorch • LangChain • LlamaIndex • MCP Protocols • Evaluators</text>
    
    <!-- Telemetry Meter -->
    <g transform="translate(530, 20)">
      <text x="0" y="10" fill="#888888" font-size="8.5" class="mono">REASONING: 92%</text>
      <rect x="0" y="16" width="180" height="5" fill="#1a1a1a" rx="2.5" />
      <rect x="0" y="16" width="165" height="5" fill="url(#meter-glow)" rx="2.5" class="meter-2" />
    </g>

    <!-- Status Badge -->
    <rect x="750" y="20" width="102" height="28" fill="#141414" stroke="#2b2b2b" stroke-width="1" rx="4" />
    <circle cx="765" cy="34" r="3" fill="#ffffff" />
    <text x="778" y="38" fill="#f5f5f5" font-size="9.5" class="mono" font-weight="700">ACTIVE</text>
  </g>

  <!-- Row 3: Modern Web & APIs -->
  <g transform="translate(24, 204)">
    <rect width="872" height="68" fill="#0d0d0d" stroke="#1c1c1c" stroke-width="1" rx="4" />
    <text x="20" y="28" fill="#ffffff" font-size="12" class="title">03 ▪ FULL-STACK SURFACES &amp; APIS</text>
    <text x="20" y="48" fill="#737373" font-size="9.5" class="mono">Next.js • React • TypeScript • FastAPI • Node.js • gRPC • Tailwind</text>
    
    <!-- Telemetry Meter -->
    <g transform="translate(530, 20)">
      <text x="0" y="10" fill="#888888" font-size="8.5" class="mono">LATENCY: 0.38ms</text>
      <rect x="0" y="16" width="180" height="5" fill="#1a1a1a" rx="2.5" />
      <rect x="0" y="16" width="160" height="5" fill="url(#meter-glow)" rx="2.5" class="meter-3" />
    </g>

    <!-- Status Badge -->
    <rect x="750" y="20" width="102" height="28" fill="#141414" stroke="#2b2b2b" stroke-width="1" rx="4" />
    <circle cx="765" cy="34" r="3" fill="#ffffff" />
    <text x="778" y="38" fill="#f5f5f5" font-size="9.5" class="mono" font-weight="700">NOMINAL</text>
  </g>

  <!-- Row 4: Contained Marquee Table -->
  <g clip-path="url(#marquee-row-clip)">
    <rect x="24" y="280" width="872" height="74" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1" rx="4" />
    <text x="44" y="300" fill="#888888" font-size="9" class="mono" font-weight="700">04 ▪ ACTIVE ECOSYSTEM MARQUEE</text>

    <!-- Clipped Marquee Track -->
    <g clip-path="url(#marquee-track-clip)">
      <g class="marquee-track" transform="translate(36, 314)">
        <!-- Sequence 1 -->
        <g transform="translate(0,0)">
          <rect width="80" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="40" y="16" text-anchor="middle" class="tag">RUST</text>
        </g>
        <g transform="translate(88,0)">
          <rect width="68" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="34" y="16" text-anchor="middle" class="tag">GO</text>
        </g>
        <g transform="translate(164,0)">
          <rect width="70" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="35" y="16" text-anchor="middle" class="tag">C++</text>
        </g>
        <g transform="translate(242,0)">
          <rect width="92" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="46" y="16" text-anchor="middle" class="tag">PYTORCH</text>
        </g>
        <g transform="translate(342,0)">
          <rect width="98" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="49" y="16" text-anchor="middle" class="tag">NEXT.JS</text>
        </g>
        <g transform="translate(448,0)">
          <rect width="112" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="56" y="16" text-anchor="middle" class="tag">KUBERNETES</text>
        </g>
        <g transform="translate(568,0)">
          <rect width="110" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="55" y="16" text-anchor="middle" class="tag">POSTGRESQL</text>
        </g>
        <g transform="translate(686,0)">
          <rect width="76" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="38" y="16" text-anchor="middle" class="tag">REDIS</text>
        </g>
        <g transform="translate(770,0)">
          <rect width="90" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="45" y="16" text-anchor="middle" class="tag">QDRANT</text>
        </g>
        <g transform="translate(868,0)">
          <rect width="110" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="55" y="16" text-anchor="middle" class="tag">TERRAFORM</text>
        </g>

        <!-- Sequence 2 (Loop duplicate) -->
        <g transform="translate(990,0)">
          <rect width="80" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="40" y="16" text-anchor="middle" class="tag">RUST</text>
        </g>
        <g transform="translate(1078,0)">
          <rect width="68" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="34" y="16" text-anchor="middle" class="tag">GO</text>
        </g>
        <g transform="translate(1154,0)">
          <rect width="70" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="35" y="16" text-anchor="middle" class="tag">C++</text>
        </g>
        <g transform="translate(1232,0)">
          <rect width="92" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="46" y="16" text-anchor="middle" class="tag">PYTORCH</text>
        </g>
        <g transform="translate(1332,0)">
          <rect width="98" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="49" y="16" text-anchor="middle" class="tag">NEXT.JS</text>
        </g>
        <g transform="translate(1438,0)">
          <rect width="112" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="56" y="16" text-anchor="middle" class="tag">KUBERNETES</text>
        </g>
        <g transform="translate(1558,0)">
          <rect width="110" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="55" y="16" text-anchor="middle" class="tag">POSTGRESQL</text>
        </g>
        <g transform="translate(1676,0)">
          <rect width="76" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="38" y="16" text-anchor="middle" class="tag">REDIS</text>
        </g>
        <g transform="translate(1760,0)">
          <rect width="90" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="45" y="16" text-anchor="middle" class="tag">QDRANT</text>
        </g>
        <g transform="translate(1858,0)">
          <rect width="110" height="24" fill="#141414" stroke="#282828" stroke-width="0.75" rx="3" />
          <text x="55" y="16" text-anchor="middle" class="tag">TERRAFORM</text>
        </g>
      </g>

      <!-- Soft Edge Fade Masks -->
      <rect x="36" y="312" width="40" height="34" fill="url(#fade-left-mask)" pointer-events="none" />
      <rect x="844" y="312" width="40" height="34" fill="url(#fade-right-mask)" pointer-events="none" />
    </g>
  </g>
</svg>
