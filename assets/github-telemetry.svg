<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <pattern id="tele-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#1c1c1c" />
    </pattern>
    <linearGradient id="metric-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #888888; }
    
    @keyframes pulseLive { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes barAnim1 { 0%, 100% { width: 88%; } 50% { width: 82%; } }
    @keyframes barAnim2 { 0%, 100% { width: 94%; } 50% { width: 90%; } }
    @keyframes barAnim3 { 0%, 100% { width: 78%; } 50% { width: 84%; } }

    .live-dot { animation: pulseLive 2s infinite ease-in-out; }
    .bar-1 { animation: barAnim1 4s ease-in-out infinite; }
    .bar-2 { animation: barAnim2 3.6s ease-in-out infinite; }
    .bar-3 { animation: barAnim3 4.2s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect width="920" height="180" fill="#060606" rx="8" />
  <rect width="920" height="180" fill="url(#tele-grid)" rx="8" />
  <rect x="8" y="8" width="904" height="164" fill="none" stroke="#222222" stroke-width="1" rx="6" />

  <!-- Left Column: Activity & Execution Stats -->
  <g transform="translate(24, 20)">
    <circle cx="8" cy="12" r="3.5" fill="#ffffff" class="live-dot" />
    <text x="22" y="15" fill="#f5f5f5" font-size="12" class="title">SYSTEM TELEMETRY &amp; REPO ACTIVITY</text>
    <text x="22" y="32" fill="#737373" font-size="9.5" class="mono">NODE: palearchitect • REPOSITORIES: ACTIVE • INTEGRITY: 100%</text>

    <!-- Metrics Grid -->
    <g transform="translate(0, 48)">
      <!-- Metric 1 -->
      <rect width="132" height="66" fill="#0e0e0e" stroke="#1f1f1f" stroke-width="1" rx="4" />
      <text x="14" y="24" fill="#737373" font-size="9" class="mono">TOTAL COMMITS</text>
      <text x="14" y="50" fill="#ffffff" font-size="20" font-weight="700" class="mono">1,420+</text>

      <!-- Metric 2 -->
      <g transform="translate(144, 0)">
        <rect width="132" height="66" fill="#0e0e0e" stroke="#1f1f1f" stroke-width="1" rx="4" />
        <text x="14" y="24" fill="#737373" font-size="9" class="mono">PRODUCTION UPTIME</text>
        <text x="14" y="50" fill="#ffffff" font-size="20" font-weight="700" class="mono">99.98%</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(288, 0)">
        <rect width="132" height="66" fill="#0e0e0e" stroke="#1f1f1f" stroke-width="1" rx="4" />
        <text x="14" y="24" fill="#737373" font-size="9" class="mono">CODE QUALITY</text>
        <text x="14" y="50" fill="#ffffff" font-size="20" font-weight="700" class="mono">A+ [SAST]</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Language Distribution & Workload -->
  <g transform="translate(480, 20)">
    <text x="0" y="15" fill="#f5f5f5" font-size="12" class="title">CORE STACK VELOCITY</text>
    <text x="0" y="32" fill="#737373" font-size="9.5" class="mono">ACTIVE DISTRIBUTION • DETERMINISTIC RUNTIMES</text>

    <g transform="translate(0, 48)">
      <!-- Lang 1 -->
      <text x="0" y="12" fill="#e5e5e5" font-size="10" class="mono">RUST / GO / C++</text>
      <text x="390" y="12" fill="#888888" font-size="9.5" text-anchor="end" class="mono">42%</text>
      <rect x="0" y="18" width="400" height="5" fill="#171717" rx="2.5" />
      <rect x="0" y="18" width="376" height="5" fill="url(#metric-fill)" rx="2.5" class="bar-1" />

      <!-- Lang 2 -->
      <text x="0" y="36" fill="#e5e5e5" font-size="10" class="mono">PYTHON (PYTORCH / AGENTS)</text>
      <text x="390" y="36" fill="#888888" font-size="9.5" text-anchor="end" class="mono">34%</text>
      <rect x="0" y="42" width="400" height="5" fill="#171717" rx="2.5" />
      <rect x="0" y="42" width="360" height="5" fill="url(#metric-fill)" rx="2.5" class="bar-2" />

      <!-- Lang 3 -->
      <text x="0" y="60" fill="#e5e5e5" font-size="10" class="mono">TYPESCRIPT / NEXT.JS / WEB</text>
      <text x="390" y="60" fill="#888888" font-size="9.5" text-anchor="end" class="mono">24%</text>
      <rect x="0" y="66" width="400" height="5" fill="#171717" rx="2.5" />
      <rect x="0" y="66" width="320" height="5" fill="url(#metric-fill)" rx="2.5" class="bar-3" />
    </g>
  </g>
</svg>
