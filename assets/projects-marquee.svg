<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Pattern -->
    <pattern id="card-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#222222" />
    </pattern>

    <!-- Edge Masks -->
    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .card-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 12.5px; fill: #ffffff; }
    .card-body { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.5px; fill: #888888; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #ffffff; font-weight: 600; }

    @keyframes glideSlider {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1240px); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .slider-track { display: flex; animation: glideSlider 30s linear infinite; }
    .beacon { animation: beaconBlink 2s infinite ease-in-out; }
  </style>

  <!-- Container -->
  <rect width="920" height="220" fill="#050505" rx="8" />
  <rect width="920" height="220" fill="url(#card-grid)" rx="8" />
  <rect x="8" y="8" width="904" height="204" fill="none" stroke="#222222" stroke-width="1.2" rx="6" />

  <!-- Header Bar -->
  <text x="28" y="32" fill="#a3a3a3" font-size="10.5" class="mono" font-weight="700">LAYER 02 // ARCHITECTURAL PILLARS &amp; FLAGSHIP DOMAINS</text>
  <text x="892" y="32" fill="#666666" font-size="9" text-anchor="end" class="mono">AUTO-GLIDE TICKER [PAUSE ON INSPECTION]</text>
  <line x1="28" y1="42" x2="892" y2="42" stroke="#222222" stroke-width="1" />

  <!-- Animated Marquee Track -->
  <g transform="translate(18, 56)">
    <g class="slider-track">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">01 // AUTONOMOUS AGENT LOOPS</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        
        <text x="14" y="50" class="card-title">Stateful Loop Orchestration</text>
        <text x="14" y="70" class="card-body">Deterministic multi-agent reasoning,</text>
        <text x="14" y="86" class="card-body">tool-calling sandboxes &amp; evaluator suites.</text>
        
        <rect x="14" y="106" width="112" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">PYTORCH • MCP</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(310, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">02 // DISTRIBUTED ENGINES</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        
        <text x="14" y="50" class="card-title">Low-Latency Async Microservices</text>
        <text x="14" y="70" class="card-body">High-throughput gRPC streaming, lock-free</text>
        <text x="14" y="86" class="card-body">message pipelines &amp; memory-safe IO.</text>
        
        <rect x="14" y="106" width="108" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">RUST • GO • C++</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(620, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">03 // VECTOR RETRIEVAL MESH</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        
        <text x="14" y="50" class="card-title">Hybrid Dense/Sparse Indexing</text>
        <text x="14" y="70" class="card-body">Graph-augmented context retrieval,</text>
        <text x="14" y="86" class="card-body">semantic clustering &amp; low-latency search.</text>
        
        <rect x="14" y="106" width="138" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">QDRANT • PINECONE</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(930, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">04 // ZERO-TRUST DEVSECOPS</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        
        <text x="14" y="50" class="card-title">Sandboxing &amp; CI/CD Pipelines</text>
        <text x="14" y="70" class="card-body">Automated SAST auditing, immutable K8s</text>
        <text x="14" y="86" class="card-body">deployments &amp; isolated container execution.</text>
        
        <rect x="14" y="106" width="124" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">K8S • TERRAFORM</text>
      </g>

      <!-- DUPLICATES FOR INFINITE TICKER (Offset +1240) -->
      <g transform="translate(1240, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">01 // AUTONOMOUS AGENT LOOPS</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        <text x="14" y="50" class="card-title">Stateful Loop Orchestration</text>
        <text x="14" y="70" class="card-body">Deterministic multi-agent reasoning,</text>
        <text x="14" y="86" class="card-body">tool-calling sandboxes &amp; evaluator suites.</text>
        <rect x="14" y="106" width="112" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">PYTORCH • MCP</text>
      </g>
      <g transform="translate(1550, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">02 // DISTRIBUTED ENGINES</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        <text x="14" y="50" class="card-title">Low-Latency Async Microservices</text>
        <text x="14" y="70" class="card-body">High-throughput gRPC streaming, lock-free</text>
        <text x="14" y="86" class="card-body">message pipelines &amp; memory-safe IO.</text>
        <rect x="14" y="106" width="108" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">RUST • GO • C++</text>
      </g>
      <g transform="translate(1860, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">03 // VECTOR RETRIEVAL MESH</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        <text x="14" y="50" class="card-title">Hybrid Dense/Sparse Indexing</text>
        <text x="14" y="70" class="card-body">Graph-augmented context retrieval,</text>
        <text x="14" y="86" class="card-body">semantic clustering &amp; low-latency search.</text>
        <rect x="14" y="106" width="138" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">QDRANT • PINECONE</text>
      </g>
      <g transform="translate(2170, 0)">
        <rect width="295" height="142" fill="#0d0d0d" stroke="#262626" stroke-width="1" rx="5" />
        <rect x="0" y="0" width="295" height="26" fill="#141414" rx="5" />
        <text x="14" y="17" fill="#ffffff" font-size="10" class="mono" font-weight="700">04 // ZERO-TRUST DEVSECOPS</text>
        <circle cx="280" cy="13" r="3" fill="#ffffff" class="beacon" />
        <text x="14" y="50" class="card-title">Sandboxing &amp; CI/CD Pipelines</text>
        <text x="14" y="70" class="card-body">Automated SAST auditing, immutable K8s</text>
        <text x="14" y="86" class="card-body">deployments &amp; isolated container execution.</text>
        <rect x="14" y="106" width="124" height="20" fill="#1c1c1c" rx="3" />
        <text x="20" y="120" class="tag">K8S • TERRAFORM</text>
      </g>
    </g>

    <!-- Fade Overlays -->
    <rect x="0" y="0" width="40" height="142" fill="url(#fade-left)" pointer-events="none" />
    <rect x="844" y="0" width="40" height="142" fill="url(#fade-right)" pointer-events="none" />
  </g>
</svg>
