<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes lineReveal1 { 0% { opacity: 0; } 10% { opacity: 1; } }
    @keyframes lineReveal2 { 0%, 20% { opacity: 0; } 30% { opacity: 1; } }
    @keyframes lineReveal3 { 0%, 45% { opacity: 0; } 55% { opacity: 1; } }
    @keyframes lineReveal4 { 0%, 70% { opacity: 0; } 80% { opacity: 1; } }

    .cursor { animation: blinkCursor 0.8s infinite; }
    .line-1 { animation: lineReveal1 8s infinite; }
    .line-2 { animation: lineReveal2 8s infinite; }
    .line-3 { animation: lineReveal3 8s infinite; }
    .line-4 { animation: lineReveal4 8s infinite; }
  </style>

  <!-- Container -->
  <rect width="920" height="200" fill="url(#term-bg)" stroke="#222222" stroke-width="1.2" rx="6" />

  <!-- Top Bar -->
  <rect width="920" height="30" fill="#141414" rx="6" />
  <circle cx="20" cy="15" r="4" fill="#333333" />
  <circle cx="34" cy="15" r="4" fill="#333333" />
  <circle cx="48" cy="15" r="4" fill="#333333" />
  
  <text x="460" y="20" fill="#737373" font-size="9.5" text-anchor="middle" class="mono">palearchitect@mesh-node-01:~ (zsh)</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 46)">
    <!-- Command Prompt -->
    <text x="0" y="16" fill="#a3a3a3" font-size="11" class="mono font-bold">$</text>
    <text x="16" y="16" fill="#ffffff" font-size="11" class="mono">pale-engine --verify-mesh --target=production-cluster</text>

    <!-- Line 1 -->
    <g class="line-1">
      <text x="16" y="40" fill="#737373" font-size="10.5" class="mono">[INFO]</text>
      <text x="70" y="40" fill="#e5e5e5" font-size="10.5" class="mono">Loading distributed agent kernels: [LangChain, LlamaIndex, PyTorch] ... <tspan fill="#ffffff" font-weight="700">OK</tspan></text>
    </g>

    <!-- Line 2 -->
    <g class="line-2">
      <text x="16" y="64" fill="#737373" font-size="10.5" class="mono">[INFO]</text>
      <text x="70" y="64" fill="#e5e5e5" font-size="10.5" class="mono">Benchmarking async IO throughput: Rust SIMD channels @ 0.38ms latency ... <tspan fill="#ffffff" font-weight="700">VERIFIED</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="line-3">
      <text x="16" y="88" fill="#737373" font-size="10.5" class="mono">[INFO]</text>
      <text x="70" y="88" fill="#e5e5e5" font-size="10.5" class="mono">Vector store sync: Qdrant + PostgreSQL WAL replication ... <tspan fill="#ffffff" font-weight="700">SYNCHRONIZED</tspan></text>
    </g>

    <!-- Line 4 -->
    <g class="line-4">
      <text x="16" y="112" fill="#ffffff" font-size="10.5" class="mono">❯ ALL SYSTEMS OPERATIONAL. ARCHITECTURAL PROTOCOL ACTIVE<tspan class="cursor" fill="#ffffff">_</tspan></text>
    </g>
  </g>
</svg>
