<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes lineReveal1 { 0% { opacity: 0; } 10% { opacity: 1; } }
    @keyframes lineReveal2 { 0%, 20% { opacity: 0; } 30% { opacity: 1; } }
    @keyframes lineReveal3 { 0%, 45% { opacity: 0; } 55% { opacity: 1; } }
    @keyframes lineReveal4 { 0%, 70% { opacity: 0; } 80% { opacity: 1; } }

    .cursor { animation: blinkCursor 0.8s infinite; }
    .line-1 { animation: lineReveal1 8s infinite; }
    .line-2 { animation: lineReveal2 8s infinite; }
    .line-3 { animation: lineReveal3 8s infinite; }
    .line-4 { animation: lineReveal4 8s infinite; }
  </style>

  <!-- Container Ground -->
  <rect width="920" height="200" fill="url(#term-bg)" stroke="#1e2e4a" stroke-width="1.2" rx="6" />

  <!-- Window Header Bar -->
  <rect width="920" height="30" fill="#0f172a" rx="6" />
  <circle cx="20" cy="15" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="35" cy="15" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="50" cy="15" r="4.5" fill="#10b981" opacity="0.8" />
  
  <text x="460" y="20" fill="#94a3b8" font-size="9.5" text-anchor="middle" class="mono" font-weight="600">palearchitect@engine-node-01:~ (zsh)</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 46)">
    <!-- Command Prompt -->
    <text x="0" y="16" fill="#38bdf8" font-size="11" class="mono" font-weight="700">❯</text>
    <text x="18" y="16" fill="#f8fafc" font-size="11" class="mono"><tspan fill="#38bdf8">pale-engine</tspan> --verify-mesh --target=production-cluster</text>

    <!-- Line 1 -->
    <g class="line-1">
      <text x="18" y="40" fill="#60a5fa" font-size="10.5" class="mono" font-weight="600">[INFO]</text>
      <text x="72" y="40" fill="#cbd5e1" font-size="10.5" class="mono">Loading distributed agent kernels: [LangChain, LlamaIndex, PyTorch] ... <tspan fill="#38bdf8" font-weight="700">OK</tspan></text>
    </g>

    <!-- Line 2 -->
    <g class="line-2">
      <text x="18" y="64" fill="#60a5fa" font-size="10.5" class="mono" font-weight="600">[INFO]</text>
      <text x="72" y="64" fill="#cbd5e1" font-size="10.5" class="mono">Benchmarking async IO throughput: Rust SIMD channels @ 0.38ms latency ... <tspan fill="#38bdf8" font-weight="700">VERIFIED</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="line-3">
      <text x="18" y="88" fill="#60a5fa" font-size="10.5" class="mono" font-weight="600">[INFO]</text>
      <text x="72" y="88" fill="#cbd5e1" font-size="10.5" class="mono">Vector store sync: Qdrant + PostgreSQL WAL replication ... <tspan fill="#38bdf8" font-weight="700">SYNCHRONIZED</tspan></text>
    </g>

    <!-- Line 4 -->
    <g class="line-4">
      <text x="18" y="112" fill="#38bdf8" font-size="10.5" class="mono" font-weight="700">❯ ALL SYSTEMS OPERATIONAL. ARCHITECTURAL PROTOCOL ACTIVE<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    </g>
  </g>
</svg>
